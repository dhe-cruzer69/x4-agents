[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x4-agents"
version = "0.1.0"
description = "Secure multi-agent orchestration runtime for the X4 ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["x4", "agents", "orchestration", "security", "mcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy"]

[project.urls]
Homepage = "https://github.com/dhe-cruzer69/x4-agents"
Repository = "https://github.com/dhe-cruzer69/x4-agents"
